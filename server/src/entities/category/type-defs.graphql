type Category {
    id: ID!
    name: String!
    slug: String!
    description: String
    isAdminOnly: Boolean!
    posts: [Post!]!     # GraphQL поймет этот тип, даже если он объявлен в другой папке
}

# Расширяем глобальный Query
extend type Query {
    categories: [Category!]!
    category(id: ID!): Category
    categoryBySlug(slug: String!): Category
}

# Расширяем глобальный Mutation
extend type Mutation {
    createPost(categoryId: ID!, title: String!, content: String!): Post!
    createCategory(name: String!, slug: String!, description: String, isAdminOnly: Boolean): Category!
    deleteCategory(id: ID!): ID!
}