scalar DateTime

enum Role {
    User
    Moderator
    Admin
}

type User {
    id: ID!
    login: String!
    email: String!
    avatar: String!
    role: Role!
    createdAt: DateTime!
    posts: [Post]
    messages: [Message]
    likes: [Like!]
    dislike: [Dislike!]
    isBanned: Boolean!
    bannedUntil: DateTime
    bannedReason: String
    isOnline: Boolean!
    lastSeen: DateTime 
}

input UpdateUserInput {
    login: String
    email: String
    avatar: String
    password: String
}

input BanUserInput {
    login: String!
    reason: String
    durationInDays: Int
}


type AuthResponse {
  accessToken: String!
  refreshToken: String!
  user: User! # Фронтенд сам выберет отсюда только id, login и avatar
}

type Query {
    me: User # Новый роут для userInfo
    users: [User!]!
    user(id: ID!): User
    getOnlineUsers: [User!]!
}

type Mutation {
    # Возвращаем AuthResponse (с двумя токенами)
    loginUser(login: String!, password: String!): AuthResponse!
    # Тоже возвращаем AuthResponse, чтобы сразу авторизовать после регистрации
    addUser(login: String!, password: String!, email: String!, avatar: String): AuthResponse!
    refreshToken(token: String!): AuthResponse!
    deleteUser(id: ID!): Boolean
    updateUser(id: ID!, input: UpdateUserInput!): User
    banUser( input: BanUserInput!): Boolean
    unbanUser(login: String!): Boolean
    logOut(id: String): Boolean!
    pingOnline: Boolean!
}

type Subscription { 
    _empty: String 
    userStatusChanged: User!
} 