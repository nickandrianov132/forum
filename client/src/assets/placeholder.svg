<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 120 120" preserveAspectRatio="xMidYMid slice">
  <!-- Темно-серый фон под стиль вашего интерфейса -->
  <rect width="120" height="120" fill="#1e293b" />
  
  <!-- Иконка пейзажа по центру -->
  <g stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Внешняя рамка миниатюры -->
    <rect x="36" y="36" width="48" height="48" rx="6" />
    <!-- Солнце -->
    <circle cx="51" cy="51" r="4" />
    <!-- Две горы -->
    <path d="M84 70 L70 56 L46 80" />
    <path d="M62 66 L54 58 L38 74" />
    <!-- Перечеркивающая диагональная линия (с легким темным контуром для читаемости) -->
    <line x1="32" y1="32" x2="88" y2="88" stroke="#1e293b" stroke-width="5" />
    <line x1="32" y1="32" x2="88" y2="88" stroke="#64748b" stroke-width="2.5" />
  </g>
</svg>